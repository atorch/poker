[project]
name = "poker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "tensorflow~=2.21",
    "keras>=3.12",
    "pandas",
    "matplotlib",
    "seaborn",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["poker"]

[tool.setuptools.package-data]
poker = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Note: lets tests import the scripts at the repo root (e.g. interactive_play.py)
pythonpath = ["."]

# CPU-only PyTorch wheels (the default Linux wheels pull in about 2.5 GB of CUDA libraries)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

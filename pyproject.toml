[project]
name = "poker"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "numpy<1.20",
    "keras",
    "tensorflow",
    "protobuf<=3.20.3",
    "pandas",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

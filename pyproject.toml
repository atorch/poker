[project]
name = "poker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "tensorflow~=2.21",
    "keras>=3.12",
    "pandas",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["poker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

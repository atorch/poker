[project]
name = "poker"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.2,<1.24",
    "keras",
    "tensorflow==2.8.4",
    "tensorflow-io-gcs-filesystem<0.32",
    "protobuf<=3.20.3",
    "pandas",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
